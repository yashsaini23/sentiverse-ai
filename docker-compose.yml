services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - sentiverse-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      CHROMA_DB_DIR: /app/data/chroma
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app/backend
      - chroma-data:/app/data/chroma
    depends_on:
      - redis
    networks:
      - sentiverse-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sentiverse-network

networks:
  sentiverse-network:
    driver: bridge

volumes:
  chroma-data:
  redis-data:
