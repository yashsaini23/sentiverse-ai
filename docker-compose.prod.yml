services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sentiverse-prod

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    networks:
      - sentiverse-prod

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CHROMA_DB_DIR: /app/data/chroma
    env_file:
      - ./backend/.env
    volumes:
      - chroma-data-prod:/app/data/chroma
    depends_on:
      - redis
    networks:
      - sentiverse-prod

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data-prod:/data
    networks:
      - sentiverse-prod

networks:
  sentiverse-prod:
    driver: bridge

volumes:
  chroma-data-prod:
  redis-data-prod:
